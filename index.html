<style>
/* Layout: one-screen app shell — header with scoreboard, scrolling vertical timeline, thumb-reach action bar at the bottom.
   Single dark "club at night" world by choice; cards take their colour from their decade. */
:root {
  --ink: #120f1f;
  --ink-2: #1c1830;
  --ink-3: #2a2545;
  --line: #3a3460;
  --fg: #f3f0ff;
  --muted: #a49fc4;
  --spot: #ffd23f;
  --good: #3ddc97;
  --bad: #ff5d73;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--spot); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }

/* ---------- shared bits ---------- */
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.btn {
  border: 0; border-radius: 14px; padding: 15px 18px; font-weight: 700; font-size: 17px;
  background: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; transition: transform .12s ease, filter .12s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--spot); color: var(--ink); }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn.good { background: var(--good); color: var(--ink); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.vinyl {
  width: 64px; height: 64px; border-radius: 50%; flex: none;
  background:
    radial-gradient(circle, var(--spot) 0 9px, var(--ink) 9px 11px, transparent 11px),
    repeating-radial-gradient(circle, #0b0915 0 2px, #1d1930 2px 3px);
  box-shadow: inset 0 0 0 2px #000;
}
.spin .vinyl { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- setup ---------- */
.setup { overflow-y: auto; flex: 1; padding-block: 28px 32px; display: flex; flex-direction: column; gap: 26px; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: .9; margin: 0; letter-spacing: -.02em; }
.brand p { margin: 6px 0 0; color: var(--muted); }
.spectrum { height: 10px; border-radius: 5px; background: linear-gradient(90deg, oklch(75% .14 200), oklch(78% .15 140), oklch(82% .15 90), oklch(75% .17 40), oklch(70% .19 0), oklch(68% .19 320), oklch(66% .17 270)); }
.spectrum-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; }
.panel { background: var(--ink-2); border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-family: var(--display); font-size: 22px; margin: 0; }
.player-row { display: flex; gap: 8px; align-items: center; }
.player-row input {
  flex: 1; min-width: 0; background: var(--ink); border: 2px solid var(--line); border-radius: 12px;
  color: var(--fg); padding: 12px 14px; font: inherit; font-size: 17px;
}
.player-row .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--ink-3); font-size: 22px; line-height: 1; flex: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { border: 2px solid var(--line); background: var(--ink); border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.seg button strong { font-size: 16px; }
.seg button span { font-size: 13px; color: var(--muted); line-height: 1.35; }
.seg button[aria-pressed="true"] { border-color: var(--spot); background: color-mix(in oklab, var(--spot) 12%, var(--ink)); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.genres { display: flex; flex-wrap: wrap; gap: 8px; }
.genres button { border: 2px solid var(--line); background: var(--ink); border-radius: 999px; padding: 9px 14px; font-weight: 600; font-size: 15px; }
.genres button[aria-pressed="true"] { border-color: var(--spot); background: color-mix(in oklab, var(--spot) 14%, var(--ink)); }
.pool-info { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.pool-info.warn { color: var(--bad); }
.seg.three button { text-align: center; align-items: center; }
.seg.three strong { font-family: var(--display); font-size: 22px; }
.resume { border: 2px solid var(--spot); }
details.help { background: var(--ink-2); border-radius: 18px; padding: 14px 16px; }
details.help summary { font-weight: 700; cursor: pointer; }
details.help ol, details.help ul { padding-left: 20px; margin: 10px 0 0; color: var(--muted); line-height: 1.55; }
details.help li + li { margin-top: 4px; }
details.help b { color: var(--fg); }

/* ---------- game ---------- */
.top { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--ink-3); }
.turn { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.turn h2 { font-family: var(--display); font-size: 30px; font-weight: 800; margin: 2px 0 0; line-height: 1; overflow-wrap: anywhere; }
.scores { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px; }
.scores::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 8px; background: var(--ink-2); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 14px; border: 2px solid transparent; }
.chip.on { border-color: var(--spot); }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip .tk { color: var(--spot); font-variant-numeric: tabular-nums; }

.board { flex: 1; overflow-y: auto; padding-block: 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.mystery {
  border-radius: 20px; padding: 18px; display: flex; gap: 16px; align-items: center;
  background: linear-gradient(135deg, var(--ink-3), var(--ink-2)); border: 2px dashed var(--line);
  perspective: 800px;
}
.mystery .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.mystery .artist { color: var(--muted); font-weight: 600; }
.mystery .title { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.mystery .hidden-title { font-family: var(--display); font-size: 22px; font-weight: 700; }
.mystery.revealed { border-style: solid; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.links a { color: var(--ink); background: var(--fg); text-decoration: none; font-weight: 700; font-size: 14px; padding: 8px 12px; border-radius: 10px; }
.peek { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; user-select: none; -webkit-user-select: none; touch-action: none; }
.peek-box { font-size: 14px; color: var(--spot); margin-top: 4px; }
.actions-row { display: flex; gap: 8px; flex-wrap: wrap; }

.tl-head { display: flex; justify-content: space-between; align-items: baseline; }
.tl-head h3 { font-family: var(--display); font-size: 20px; margin: 0; }
.timeline { display: flex; flex-direction: column; gap: 0; }
.card {
  --h: 200;
  display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 12px;
  border-radius: 14px; padding: 12px 14px;
  background: oklch(78% .13 var(--h)); color: #15111f;
}
.card .yr { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.card .meta { min-width: 0; }
.card .meta b { display: block; font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
.card .meta span { font-size: 14px; opacity: .78; overflow-wrap: anywhere; }
.card.new { animation: pop .5s cubic-bezier(.2,1.4,.4,1); box-shadow: 0 0 0 3px var(--fg); }
@keyframes pop { from { transform: scale(.8); opacity: .3; } }

.slot {
  border: 0; background: transparent; width: 100%; padding: 4px 0; min-height: 30px;
  display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 600;
}
.slot::before, .slot::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 1px; }
.slot .plus { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.slot:hover .plus { border-color: var(--fg); color: var(--fg); }
.slot.locked { pointer-events: none; }
.slot.locked .plus { display: none; }
.slot.locked::before, .slot.locked::after { background: transparent; }
.ghost {
  border-radius: 14px; padding: 12px 14px; margin: 4px 0; display: flex; align-items: center; gap: 12px;
  border: 2px dashed var(--spot); background: color-mix(in oklab, var(--spot) 10%, var(--ink));
  font-weight: 700;
}
.ghost .q { font-family: var(--display); font-size: 28px; font-weight: 800; width: 66px; color: var(--spot); }
.ghost.challenger { border-color: var(--fg); background: var(--ink-2); }
.ghost.challenger .q { color: var(--fg); }
.ghost.ok { border-style: solid; border-color: var(--good); }
.ghost.ok .q { color: var(--good); }
.ghost.no { border-style: solid; border-color: var(--bad); opacity: .85; }
.ghost.no .q { color: var(--bad); }
.ghost small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }

.banner { border-radius: 16px; padding: 14px 16px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
.banner.ok { background: color-mix(in oklab, var(--good) 22%, var(--ink)); }
.banner.no { background: color-mix(in oklab, var(--bad) 22%, var(--ink)); }
.banner span { font-weight: 500; color: var(--muted); }

.bar {
  border-top: 1px solid var(--ink-3); background: var(--ink);
  padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
.bar .hint { text-align: center; color: var(--muted); font-size: 15px; padding: 14px 0; }
.bar .row { display: flex; gap: 8px; }
.bar .row .btn { flex: 1; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; background: color-mix(in oklab, #000 65%, transparent); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet {
  width: 100%; max-width: 560px; background: var(--ink-2); border-radius: 22px 22px 0 0;
  padding-block: 20px max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; animation: up .25s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { font-family: var(--display); font-size: 24px; margin: 0; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.45; }

/* ---------- win ---------- */
.win { flex: 1; overflow-y: auto; padding-block: 36px; display: flex; flex-direction: column; gap: 20px; }
.win h1 { font-family: var(--display); font-size: 52px; line-height: .95; margin: 0; letter-spacing: -.02em; overflow-wrap: anywhere; }
.rank { display: flex; flex-direction: column; gap: 8px; }
.rank div { display: flex; justify-content: space-between; background: var(--ink-2); border-radius: 12px; padding: 12px 14px; font-variant-numeric: tabular-nums; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

const SONGS = RAW.split('\n').map(l => { const [y, a, t, g] = l.split('|'); return { y: +y, a, t, g }; });
const GENRES = [['R', 'Rock'], ['P', 'Pop'], ['D', 'Dance & Elektro'], ['H', 'Hip-Hop & R&B'], ['S', 'Soul, Funk & Disco'], ['K', 'Schlager'], ['G', 'Deutschsprachig']];
const genreName = gs => gs.length ? gs.map(g => GENRES.find(x => x[0] === g)[1]).join(' + ') : 'Alle Genres';
// no genre picked means all songs; several genres combine (Rock + Pop = every song that is either)
const pool = gs => SONGS.map((_, i) => i).filter(i => !gs.length || gs.some(g => SONGS[i].g.includes(g)));
const PCOL = ['#ffd23f', '#5ce1e6', '#ff7ab6', '#9b8cff', '#3ddc97', '#ff9f43', '#f5f5f5', '#ff5d73'];
const START_TOKENS = 2, MAX_TOKENS = 5;
const KEY = 'hitlinie-v1';

const $app = document.getElementById('app');
let S;              // game state
let ui = { menu: false, pickChallenger: false, peek: false };

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hue = y => ((200 - (y - 1950) * 3.9) % 360 + 360) % 360;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sorted = cards => cards.slice().sort((x, y) => SONGS[x].y - SONGS[y].y);

// a game in progress and the setup form are stored apart, so opening the setup never overwrites a running game
function save() { try { localStorage.setItem(S.screen === 'setup' ? KEY + '-setup' : KEY, JSON.stringify(S)); } catch (e) {} }
function load(k = KEY) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }

function freshSetup(prev) {
  return {
    screen: 'setup',
    names: prev?.names || ['Spieler 1', 'Spieler 2'],
    target: prev?.target || 10,
    blind: prev?.blind ?? false,
    genres: prev?.genres || [],
  };
}

function startGame() {
  const names = S.names.map((n, i) => n.trim() || `Spieler ${i + 1}`);
  const deck = shuffle(pool(S.genres));
  const players = names.map(name => ({ name, cards: [deck.pop()], tokens: START_TOKENS }));
  S = { screen: 'game', names, target: S.target, blind: S.blind, genres: S.genres, players, deck, current: 0, round: 1 };
  newTurn(true);
}

function newTurn(first) {
  if (!first) S.current = (S.current + 1) % S.players.length;
  if (!S.deck.length) { finish(); return; }
  Object.assign(S, { card: S.deck.pop(), phase: 'place', slot: null, challenger: null, cslot: null, result: null, bonus: false });
  ui.peek = false;
}

function fits(cards, slot, y) {
  const c = sorted(cards);
  const lo = slot === 0 || SONGS[c[slot - 1]].y <= y;
  const hi = slot === c.length || y <= SONGS[c[slot]].y;
  return lo && hi;
}

function reveal() {
  const p = S.players[S.current];
  const y = SONGS[S.card].y;
  const ok = fits(p.cards, S.slot, y);
  let cOk = false;
  if (S.challenger != null) {
    S.players[S.challenger].tokens--;
    cOk = !ok && fits(p.cards, S.cslot, y);
  }
  if (ok) p.cards.push(S.card);
  else if (cOk) S.players[S.challenger].cards.push(S.card);
  S.result = { ok, cOk, winner: ok ? S.current : cOk ? S.challenger : null };
  S.phase = 'reveal';
}

function finish() {
  S.screen = 'win';
}

function leader() {
  return S.players.findIndex(p => p.cards.length >= S.target);
}

/* ---------------- render ---------------- */

function render() {
  if (S.screen === 'setup') renderSetup();
  else if (S.screen === 'game') renderGame();
  else renderWin();
  save();
}

function chips() {
  return S.players.map((p, i) => `
    <div class="chip ${i === S.current ? 'on' : ''}">
      <span class="dot" style="background:${PCOL[i % PCOL.length]}"></span>

      <span class="tk" aria-label="${p.tokens} Token">● ${p.tokens}</span>
    </div>`).join('');
}

function cardHTML(i, isNew) {
  const s = SONGS[i];
  return `<div class="card ${isNew ? 'new' : ''}" style="--h:${hue(s.y)}">
    <div class="yr">${s.y}</div>
    <div class="meta"><b>${esc(s.t)}</b><span>${esc(s.a)}</span></div>
  </div>`;
}

function mysteryHTML() {
  const s = SONGS[S.card];
  const q = encodeURIComponent(`${s.a} ${s.t}`);
  const links = `<div class="links">
      <a href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener">▶ Spotify</a>
      <a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">▶ YouTube</a>
      <a href="https://music.apple.com/search?term=${q}" target="_blank" rel="noopener">▶ Apple Music</a>
    </div>`;
  if (S.phase === 'reveal') {
    return `<div class="mystery revealed" style="border-color:oklch(78% .13 ${hue(s.y)})">
      <div class="vinyl"></div>
      <div class="info">
        <span class="eyebrow" style="color:oklch(82% .13 ${hue(s.y)})">${s.y}</span>
        <span class="title">${esc(s.t)}</span>
        <span class="artist">${esc(s.a)}</span>
        ${links}
      </div>

  }
  if (S.blind) {
    return `<div class="mystery spin">
      <div class="vinyl"></div>
      <div class="info">
        <span class="eyebrow">Neuer Song</span>
        <span class="hidden-title">Wer singt das?</span>

        ${links}

        <div class="peek-box" id="peekbox" ${ui.peek ? '' : 'hidden'}>${esc(s.a)} – ${esc(s.t)}</div>

    <div class="vinyl"></div>
    <div class="info">

    </div>
  </div>`;
}

function timelineHTML() {
  const p = S.players[S.current];
  const cards = sorted(p.cards);
  const ph = S.phase;
  const choosing = ph === 'place' || ph === 'challenge';
  const ch = S.challenger != null ? S.players[S.challenger] : null;
  const y = SONGS[S.card].y;
  const ghost = (slot) => {
    let out = '';
    if (ph !== 'reveal' || !S.result.ok) {
      if (S.slot === slot && ph !== 'reveal') {
        out += `<div class="ghost"><span class="q">?</span><div>${esc(p.name)}<small>${ph === 'place' ? 'Hier einordnen?' : 'eingeloggt'}</small></div></div>`;
      }
    }
    if (ph === 'reveal' && S.slot === slot && !S.result.ok) {
      out += `<div class="ghost no"><span class="q">✗</span><div>${esc(p.name)}<small>falsch eingeordnet</small></div></div>`;
    }
    if (ch && S.cslot === slot) {
      if (ph === 'reveal') {
        const ok = fits(p.cards.filter(c => c !== S.card), slot, y);
        out += `<div class="ghost challenger ${ok ? 'ok' : 'no'}"><span class="q">${ok ? '✓' : '✗'}</span><div>${esc(ch.name)}<small>Einspruch</small></div></div>`;
      } else {
        out += `<div class="ghost challenger"><span class="q">!</span><div>${esc(ch.name)}<small>Einspruch</small></div></div>`;
      }
    }
    return out;
  };
  const slotBtn = (i) => {
    const taken = ph === 'challenge' && i === S.slot;
    if (!choosing || taken) return `<div class="slot locked"></div>`;
    const label = i === 0 ? 'davor' : i === cards.length ? 'danach' : 'dazwischen';
    return `<button class="slot" data-act="slot" data-i="${i}" aria-label="Hier einordnen: ${label}"><span class="plus">+</span></button>`;
  };
  // in reveal the new card is already part of the timeline when correct
  const shown = ph === 'reveal' ? sorted(p.cards) : cards;
  const base = ph === 'reveal' ? cards.filter(c => c !== S.card) : cards;
  let html = '';
  if (ph === 'reveal') {
    // render final timeline, plus wrong guesses at their original slot positions (based on timeline without the new card)
    let bi = 0;
    for (let i = 0; i <= base.length; i++) {
      html += ghost(i);
      if (i < base.length) {
        // inject the newly won card right where it belongs
        while (shown[bi] !== base[i]) { html += cardHTML(shown[bi], true); bi++; }
        html += cardHTML(base[i]); bi++;
      }
    }
    while (bi < shown.length) { html += cardHTML(shown[bi], true); bi++; }
  } else {
    for (let i = 0; i <= cards.length; i++) {
      html += S.slot === i || S.cslot === i ? ghost(i) : slotBtn(i);
      if (i < cards.length) html += cardHTML(cards[i]);
    }
  }
  return html;
}

function bannerHTML() {
  if (S.phase !== 'reveal') return '';
  const s = SONGS[S.card];
  const p = S.players[S.current];
  const r = S.result;
  if (r.ok) return `<div class="banner ok">Richtig, ${esc(p.name)}! <span>„${esc(s.t)}“ kam ${s.y} raus. Die Karte bleibt im Zeitstrahl.</span></div>`;
  if (r.cOk) return `<div class="banner ok">Einspruch erfolgreich! ${esc(S.players[S.challenger].name)} schnappt sich die Karte. <span>Der Song ist von ${s.y}.</span></div>`;
  return `<div class="banner no">Daneben. <span>Der Song ist von ${s.y}. Die Karte fliegt raus.</span></div>`;
}

function barHTML() {
  const p = S.players[S.current];
  if (S.phase === 'place') {
    if (S.slot == null) return `<div class="hint">Tippe auf eine Lücke im Zeitstrahl.</div>`;
    return `<div class="row"><button class="btn ghost" data-act="unslot">Ändern</button><button class="btn primary" data-act="lock">Einloggen</button></div>`;
  }
  if (S.phase === 'locked') {
    const canChallenge = S.players.some((q, i) => i !== S.current && q.tokens > 0);
    return `<div class="row">
      ${canChallenge ? `<button class="btn ghost" data-act="challenge">Einspruch!</button>` : ''}
      <button class="btn primary" data-act="reveal">Aufdecken</button>
    </div>`;
  }
  if (S.phase === 'challenge') {
    const ch = S.players[S.challenger];
    if (S.cslot == null) return `<div class="row"><button class="btn ghost" data-act="cancelChallenge">Abbrechen</button></div><div class="hint" style="padding:4px 0">${esc(ch.name)}: Wähle eine andere Lücke.</div>`;
    return `<div class="row"><button class="btn ghost" data-act="uncslot">Ändern</button><button class="btn primary" data-act="reveal">Aufdecken</button></div>`;
  }
  // reveal
  const won = leader();
  const bonusLabel = S.blind ? 'Titel + Interpret erraten' : 'Exaktes Jahr genannt';
  return `
    ${!S.bonus && p.tokens < MAX_TOKENS ? `<button class="btn ghost" data-act="bonus">${bonusLabel}: +1 Token für ${esc(p.name)}</button>` : ''}
    ${S.bonus ? `<div class="hint" style="padding:4px 0">+1 Token für ${esc(p.name)}</div>` : ''}
    <button class="btn primary" data-act="next">${won >= 0 ? 'Zur Siegerehrung' : `Weiter: ${esc(S.players[(S.current + 1) % S.players.length].name)}`}</button>`;
}

function renderGame() {
  const p = S.players[S.current];
  const board = $app.querySelector('.board');
  const scroll = board && !ui.top ? board.scrollTop : 0;
  ui.top = false;
  $app.innerHTML = `
  <header class="top wrap">
    <div class="turn">
      <div><div class="eyebrow">Am Zug · ${esc(genreName(S.genres || []))} · noch ${S.deck.length}</div><h2 style="color:${PCOL[S.current % PCOL.length]}">${esc(p.name)}</h2></div>
      <button class="btn small" data-act="menu" aria-label="Menü">Menü</button>
    </div>
    <div class="scores">${chips()}</div>
  </header>
  <main class="board wrap">
    ${mysteryHTML()}
    ${bannerHTML()}
    ${S.phase === 'place' && p.tokens > 0 ? `<div class="actions-row"><button class="btn small" data-act="skip">Song überspringen · 1 Token</button></div>` : ''}
    <div>
      <div class="tl-head"><h3>Zeitstrahl von ${esc(p.name)}</h3><span class="eyebrow">${p.cards.length} ${p.cards.length === 1 ? 'Karte' : 'Karten'}</span></div>
      <div class="timeline">${timelineHTML()}</div>
    </div>
  </main>
  <footer class="bar wrap">${barHTML()}</footer>
  ${ui.pickChallenger ? `
  <div class="overlay" data-act="closeOverlay">
    <div class="sheet" role="dialog" aria-label="Einspruch erheben">
      <h3>Wer erhebt Einspruch?</h3>
      <p>Kostet einen Token. Liegt ${esc(p.name)} falsch und du richtig, bekommst du die Karte.</p>
      ${S.players.map((q, i) => i === S.current ? '' : `<button class="btn" data-act="pickChallenger" data-i="${i}" ${q.tokens > 0 ? '' : 'disabled'}>${esc(q.name)} · ● ${q.tokens}</button>`).join('')}
      <button class="btn ghost" data-act="closeOverlay">Abbrechen</button>
    </div>
  </div>` : ''}
  ${ui.menu ? `
  <div class="overlay" data-act="closeOverlay">
    <div class="sheet" role="dialog" aria-label="Menü">
      <h3>Menü</h3>
      <p>Das Spiel wird automatisch auf diesem Gerät gespeichert.</p>
      <button class="btn" data-act="closeOverlay">Weiterspielen</button>
      <button class="btn" data-act="end">Spiel beenden und auswerten</button>
      <button class="btn ghost" data-act="toSetup">Neues Spiel einrichten</button>
    </div>
  </div>` : ''}`;
  const nb = $app.querySelector('.board');
  if (nb) nb.scrollTop = scroll;
}

function renderWin() {
  const ranked = S.players.map((p, i) => ({ ...p, i })).sort((a, b) => b.cards.length - a.cards.length || b.tokens - a.tokens);
  const w = ranked[0];
  $app.innerHTML = `
  <div class="win wrap">
    <div class="vinyl" style="width:96px;height:96px"></div>
    <div><div class="eyebrow">Sieg</div><h1 style="color:${PCOL[w.i % PCOL.length]}">${esc(w.name)}</h1></div>
    <div class="rank">${ranked.map((p, k) => `<div><span>${k + 1}. ${esc(p.name)}</span><span>${p.cards.length} Karten · ● ${p.tokens}</span></div>`).join('')}</div>
    <div><div class="eyebrow" style="margin-bottom:8px">Zeitstrahl von ${esc(w.name)}</div>
      <div class="timeline" style="gap:6px">${sorted(w.cards).map(c => cardHTML(c)).join('')}</div></div>
    <button class="btn primary" data-act="again">Revanche</button>
    <button class="btn ghost" data-act="toSetup">Neue Runde einrichten</button>
  </div>`;
  confetti();
}

/* ---------------- events ---------------- */

$app.addEventListener('input', e => {
  const i = e.target.dataset.name;
  if (i != null) { S.names[+i] = e.target.value; save(); }
});

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('overlay') && e.target !== el) return; // clicks inside the sheet
  const act = el.dataset.act, i = el.dataset.i != null ? +el.dataset.i : null, v = el.dataset.v;
  switch (act) {
    case 'add': S.names.push(`Spieler ${S.names.length + 1}`); break;
    case 'del': S.names.splice(i, 1); break;
    case 'mode': S.blind = v === '1'; break;
    case 'target': S.target = +v; break;
    case 'genre':
      if (!v) S.genres = [];
      else S.genres = S.genres.includes(v) ? S.genres.filter(g => g !== v) : [...S.genres, v];
      break;
    case 'start': startGame(); break;
    case 'resume': S = load(); break;
    case 'slot':
      if (S.phase === 'place') S.slot = i; else S.cslot = i;
      break;
    case 'unslot': S.slot = null; break;
    case 'uncslot': S.cslot = null; break;
    case 'lock': S.phase = 'locked'; break;
    case 'challenge': ui.pickChallenger = true; break;
    case 'pickChallenger': S.challenger = i; S.phase = 'challenge'; ui.pickChallenger = false; break;
    case 'cancelChallenge': S.challenger = null; S.cslot = null; S.phase = 'locked'; break;
    case 'reveal': reveal(); break;
    case 'skip': S.players[S.current].tokens--; S.card = S.deck.length ? S.deck.pop() : S.card; S.slot = null; ui.peek = false; break;
    case 'bonus': S.players[S.current].tokens = Math.min(MAX_TOKENS, S.players[S.current].tokens + 1); S.bonus = true; break;
    case 'next':
      if (leader() >= 0) finish(); else newTurn();
      ui.top = true;
      break;
    case 'menu': ui.menu = true; break;
    case 'closeOverlay': ui.menu = false; ui.pickChallenger = false; break;
    case 'end': ui.menu = false; finish(); break;
    case 'toSetup': ui.menu = false; S = freshSetup(S); break;
    case 'again': S = { ...freshSetup(S), names: S.players.map(p => p.name) }; startGame(); break;
  }
  render();
});

// press-and-hold peek for the DJ in blind mode
function setPeek(on) {
  ui.peek = on;
  const box = document.getElementById('peekbox');
  if (box) box.hidden = !on;
}
$app.addEventListener('pointerdown', e => { if (e.target.closest('[data-peek]')) { e.preventDefault(); setPeek(true); } });
['pointerup', 'pointercancel', 'pointerout'].forEach(t => $app.addEventListener(t, e => { if (ui.peek && e.target.closest('[data-peek]')) setPeek(false); }));
$app.addEventListener('contextmenu', e => { if (e.target.closest('[data-peek]')) e.preventDefault(); });
$app.addEventListener('keydown', e => { if (e.target.closest('[data-peek]') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); setPeek(!ui.peek); } });

/* ---------------- confetti ---------------- */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti');
  const x = c.getContext('2d');
  c.hidden = false;
  c.width = innerWidth; c.height = innerHeight;
  const bits = Array.from({ length: 140 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6,
    r: 4 + Math.random() * 6, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,
    h: Math.floor(Math.random() * 360), a: Math.random() * 6,
  }));
  let t = 0;
  (function tick() {
    x.clearRect(0, 0, c.width, c.height);
    bits.forEach(b => {
      b.y += b.vy; b.x += b.vx; b.a += .1;
      x.fillStyle = `hsl(${b.h} 90% 65%)`;
      x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2); x.restore();
    });
    if (++t < 240) requestAnimationFrame(tick); else { c.hidden = true; }
  })();
}

/* ---------------- boot ---------------- */
function boot(data) {
  const g = load();
  S = (data && data.S) || (g && g.screen === 'game' ? g : freshSetup(load(KEY + '-setup')));
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
<script>
// reload once when an updated service worker takes over, so the new version shows without a second launch
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
}
</script>
